# Optional managed PostgreSQL. Existing PostgreSQL deployments can omit this file.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: knowseam
      POSTGRES_USER: knowseam
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U knowseam -d knowseam"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    # No host database port. API/worker connect through the project network.
secrets:
  postgres_password:
    file: ../secrets/postgres-password.txt
volumes:
  postgres-data:
